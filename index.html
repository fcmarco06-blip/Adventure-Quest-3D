<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Adventure Quest 3D</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101a19;color:white;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none}
.brand{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(15px,3vw,24px);letter-spacing:2px;text-shadow:0 2px 8px #000}
.panel{position:absolute;background:#101a1cce;border:1px solid #c5a45c;border-radius:18px;padding:9px 13px;box-shadow:0 3px 14px #0008}
.coins{top:15px;left:15px;font-weight:bold}
.map{position:absolute;top:65px;left:14px;width:90px;height:90px;border-radius:50%;border:3px solid #c7a45c;background:radial-gradient(circle,#466c43,#172d24);display:grid;place-items:center;box-shadow:0 3px 12px #000}
.map:after{content:"N";position:absolute;top:5px;font-weight:bold}
.playerinfo{position:absolute;top:15px;right:14px;background:#14201ddc;border:1px solid #b99b5b;border-radius:25px;padding:8px 12px;font-size:11px}
.bar{width:100px;height:9px;border-radius:10px;background:#333;margin:3px 0;overflow:hidden}
.hp{height:100%;width:100%;background:linear-gradient(90deg,#a91818,#ff5555)}
.mp{height:100%;width:100%;background:linear-gradient(90deg,#1265c3,#48caff)}
#controls{position:fixed;inset:0;pointer-events:none}
.btn{position:absolute;width:65px;height:65px;border-radius:50%;border:2px solid #d0b46d;background:linear-gradient(145deg,#34423e,#101817);color:white;box-shadow:0 4px 12px #000a;font-weight:bold;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
.btn strong{font-size:23px}
.btn:active{transform:scale(.92);filter:brightness(1.4)}
#talk{right:18px;top:35%;width:61px;height:61px}
#interact{left:22%;bottom:25px}
#jump{left:17px;bottom:22px;border-color:#a58af5}
#sword{left:17px;top:190px}
#bag{left:17px;top:115px}
#run{right:20px;bottom:30px}
#joystick{position:absolute;right:18px;bottom:25px;width:112px;height:112px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff77;pointer-events:auto;touch-action:none;backdrop-filter:blur(5px)}
#stick{position:absolute;left:31px;top:31px;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#ddd,#777);border:2px solid white;box-shadow:0 3px 10px #000}
#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:10px 17px;border-radius:20px;background:#111b19c9;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .3s}
@media(orientation:portrait){
 #message{top:43%}
}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
 <div class="brand">✦ ADVENTURE QUEST 3D ✦</div>
 <div class="panel coins">🪙 000</div>
 <div class="map">🧭</div>
 <div class="playerinfo">
  <b>NIVEAU 1</b>
  <div>❤️ <div class="bar"><div class="hp"></div></div></div>
  <div>⚡ <div class="bar"><div class="mp"></div></div></div>
 </div>
 <div id="message"></div>
</div>

<div id="controls">
 <button class="btn" id="bag"><strong>🎒</strong>SAC</button>
 <button class="btn" id="sword"><strong>⚔</strong>ÉPÉE</button>
 <button class="btn" id="jump"><strong>□</strong>SAUTER</button>
 <button class="btn" id="interact"><strong>△</strong>INTERAGIR</button>
 <button class="btn" id="talk"><strong>○</strong>PARLER</button>
 <button class="btn" id="run"><strong>×</strong>COURIR</button>
 <div id="joystick"><div id="stick"></div></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ab8c4);
scene.fog=new THREE.FogExp2(0x9ab8c4,.008);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,350);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.getElementById('game').appendChild(renderer.domElement);

// LUMIÈRES
scene.add(new THREE.HemisphereLight(0xcde6ff,0x39482b,2.1));
const sun=new THREE.DirectionalLight(0xffe6c0,3);
sun.position.set(-35,55,25);
sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536);
sun.shadow.camera.left=-45;
sun.shadow.camera.right=45;
sun.shadow.camera.top=45;
sun.shadow.camera.bottom=-45;
scene.add(sun);

// TEXTURES PROCÉDURALES
function texture(base,colors,scale=1){
 const canvas=document.createElement('canvas');
 canvas.width=512;canvas.height=512;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle=base;ctx.fillRect(0,0,512,512);
 for(let i=0;i<16000;i++){
  ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];
  const x=Math.random()*512,y=Math.random()*512;
  const s=Math.random()*3+0.5;
  ctx.globalAlpha=.15+Math.random()*.5;
  ctx.fillRect(x,y,s,s);
 }
 ctx.globalAlpha=1;
 const t=new THREE.CanvasTexture(canvas);
 t.wrapS=t.wrapT=THREE.RepeatWrapping;
 t.repeat.set(scale,scale);
 t.colorSpace=THREE.SRGBColorSpace;
 return t;
}

const grass=texture('#536d3b',['#81964d','#304d2c','#6d8542','#405e31'],9);
const dirt=texture('#735c43',['#a18a67','#493b30','#887151','#594934'],5);
const bark=texture('#533624',['#805338','#30231a','#9a6940'],2);
const stone=texture('#77776e',['#aaa99a','#494c49','#8d8b7c'],2);

function material(map,roughness=1){
 return new THREE.MeshStandardMaterial({map,roughness});
}

// TERRAIN
const terrain=new THREE.Mesh(
 new THREE.PlaneGeometry(300,300),
 material(grass)
);
terrain.rotation.x=-Math.PI/2;
terrain.receiveShadow=true;
scene.add(terrain);

// CHEMIN
const path=new THREE.Mesh(
 new THREE.PlaneGeometry(7,105),
 material(dirt)
);
path.rotation.x=-Math.PI/2;
path.position.set(0,.025,-35);
scene.add(path);

// COLLISIONS
const obstacles=[];
function obstacle(x,z,r){obstacles.push({x,z,r})}

// ROCHERS
for(let i=0;i<65;i++){
 const x=(Math.random()-.5)*90;
 const z=(Math.random()-.5)*100;
 if(Math.abs(x)<6 && z<5 && z>-60)continue;
 const size=.6+Math.random()*1.5;
 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(size,2),
  new THREE.MeshStandardMaterial({map:stone,roughness:.95})
 );
 rock.position.set(x,size*.55,z);
 rock.scale.set(1,.7+Math.random()*.5,.9);
 rock.rotation.set(Math.random(),Math.random(),Math.random());
 rock.castShadow=true;rock.receiveShadow=true;
 scene.add(rock);
 obstacle(x,z,size*.9);
}

// ARBRES
function tree(x,z,s){
 const group=new THREE.Group();
 group.position.set(x,0,z);
 group.scale.setScalar(s);

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.48,4,12),
  material(bark)
 );
 trunk.position.y=2;
 trunk.castShadow=true;
 group.add(trunk);

 for(let i=0;i<4;i++){
  const leaves=new THREE.Mesh(
   new THREE.IcosahedronGeometry(2.2-i*.25,3),
   new THREE.MeshStandardMaterial({
    color:[0x294d2c,0x386239,0x496e39,0x315631][i],
    roughness:1
   })
  );
  leaves.position.set(
   (Math.random()-.5)*.5,
   4.2+i*.85,
   (Math.random()-.5)*.5
  );
  leaves.scale.set(1,1.15,.95);
  leaves.castShadow=true;
  group.add(leaves);
 }
 scene.add(group);
 obstacle(x,z,1.15*s);
}

for(let i=0;i<95;i++){
 const x=(Math.random()-.5)*105;
 const z=(Math.random()-.5)*120;
 if(Math.abs(x)<7 && z<5 && z>-60)continue;
 tree(x,z,.8+Math.random()*.65);
}

// MONTAGNES
for(let i=0;i<17;i++){
 const h=12+Math.random()*20;
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(13+Math.random()*10,h,8),
  new THREE.MeshStandardMaterial({color:0x586b63,roughness:1})
 );
 mountain.position.set((Math.random()-.5)*150,h/2-3,-85-Math.random()*80);
 scene.add(mountain);
}

// EAU
const water=new THREE.Mesh(
 new THREE.PlaneGeometry(30,85),
 new THREE.MeshStandardMaterial({
  color:0x348b9d,metalness:.2,roughness:.23,
  transparent:true,opacity:.9
 })
);
water.rotation.x=-Math.PI/2;
water.position.set(20,.08,-30);
scene.add(water);

// PERSONNAGE
const player=new THREE.Group();
scene.add(player);

const clothes=new THREE.MeshStandardMaterial({color:0x263d3a,roughness:.8});
const leather=new THREE.MeshStandardMaterial({color:0x55402e});
const skin=new THREE.MeshStandardMaterial({color:0xb9825d});
const gold=new THREE.MeshStandardMaterial({color:0xc6a45e,metalness:.65,roughness:.3});

function addPart(geometry,mat,x,y,z){
 const m=new THREE.Mesh(geometry,mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 player.add(m);
 return m;
}

const torso=addPart(new THREE.CapsuleGeometry(.43,.75,7,12),clothes,0,1.25,0);
addPart(new THREE.SphereGeometry(.29,20,20),skin,0,2.08,0);
addPart(new THREE.SphereGeometry(.31,16,12,0,Math.PI*2,0,Math.PI*.55),leather,0,2.18,0);

// Cape
const cape=addPart(new THREE.BoxGeometry(.78,1.15,.12),clothes,0,1.05,.39);
cape.rotation.x=-.08;

// Belt
addPart(new THREE.BoxGeometry(.9,.12,.5),leather,0,.95,0);
addPart(new THREE.BoxGeometry(.16,.16,.08),gold,0,.95,-.27);

// Bras et jambes
const limbs=[];
for(let i=0;i<2;i++){
 const side=i===0?-1:1;
 const arm=addPart(new THREE.CapsuleGeometry(.13,.53,5,8),leather,side*.52,1.35,0);
 arm.rotation.z=-side*.2;
 const leg=addPart(new THREE.CapsuleGeometry(.16,.6,5,8),leather,side*.22,.43,0);
 limbs.push({arm,leg});
}

// ÉPÉE DANS LE DOS
const sword=new THREE.Group();
const blade=new THREE.Mesh(
 new THREE.BoxGeometry(.11,.95,.045),
 new THREE.MeshStandardMaterial({color:0xbac9ce,metalness:.85,roughness:.2})
);
blade.position.y=.5;sword.add(blade);
const handle=new THREE.Mesh(
 new THREE.CylinderGeometry(.045,.045,.32,8),leather
);
handle.position.y=-.12;sword.add(handle);
sword.position.set(.35,1.45,.4);
sword.rotation.z=-.25;
player.add(sword);

// CONTRÔLES
let mx=0,my=0,running=false,jumping=false,jumpTime=0;
const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');
let active=false;

function moveJoystick(e){
 const r=joy.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const d=Math.hypot(dx,dy),max=34;
 if(d>max){dx=dx/d*max;dy=dy/d*max;}
 mx=dx/max;my=dy/max;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}

joy.addEventListener('pointerdown',e=>{
 active=true;joy.setPointerCapture(e.pointerId);moveJoystick(e);
});
joy.addEventListener('pointermove',e=>{if(active)moveJoystick(e)});
function reset(){
 active=false;mx=my=0;stick.style.transform='translate(0,0)';
}
joy.addEventListener('pointerup',reset);
joy.addEventListener('pointercancel',reset);

const run=document.getElementById('run');
run.addEventListener('pointerdown',()=>running=true);
run.addEventListener('pointerup',()=>running=false);
run.addEventListener('pointercancel',()=>running=false);
run.addEventListener('pointerleave',()=>running=false);

function notify(text){
 const el=document.getElementById('message');
 el.textContent=text;el.style.opacity=1;
 clearTimeout(window.msgTimer);
 window.msgTimer=setTimeout(()=>el.style.opacity=0,1800);
}

document.getElementById('jump').onclick=()=>{
 if(!jumping){jumping=true;jumpTime=0;}
};
document.getElementById('sword').onclick=()=>notify("Épée équipée");
document.getElementById('bag').onclick=()=>notify("Inventaire bientôt disponible");
document.getElementById('talk').onclick=()=>notify("Aucun joueur à proximité");
document.getElementById('interact').onclick=()=>notify("Aucun objet à proximité");

// CLAVIER
window.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'||e.key==='w')my=-1;
 if(e.key==='ArrowDown'||e.key==='s')my=1;
 if(e.key==='ArrowLeft'||e.key==='a')mx=-1;
 if(e.key==='ArrowRight'||e.key==='d')mx=1;
 if(e.key==='Shift')running=true;
});
window.addEventListener('keyup',e=>{
 if(['ArrowUp','ArrowDown','w','s'].includes(e.key))my=0;
 if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))mx=0;
 if(e.key==='Shift')running=false;
});

// CAMÉRA ET DÉPLACEMENT
camera.position.set(0,4,8);
const clock=new THREE.Clock();
const desiredCamera=new THREE.Vector3();
const lookTarget=new THREE.Vector3();
let facing=0;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const moving=Math.hypot(mx,my)>.12;

 if(moving){
  const speed=running?7:3.5;
  const dx=mx*speed*dt;
  const dz=my*speed*dt;

  // TEST DES COLLISIONS
  function blocked(x,z){
   for(const o of obstacles){
    if(Math.hypot(x-o.x,z-o.z)<o.r+.48)return true;
   }
   return false;
  }

  if(!blocked(player.position.x+dx,player.position.z))
   player.position.x+=dx;

  if(!blocked(player.position.x,player.position.z+dz))
   player.position.z+=dz;

  facing=Math.atan2(mx,my);
  player.rotation.y=facing;

  const swing=performance.now()*.009*(running?1.5:1);
  limbs[0].leg.rotation.x=Math.sin(swing)*.55;
  limbs[1].leg.rotation.x=-Math.sin(swing)*.55;
  limbs[0].arm.rotation.x=-Math.sin(swing)*.35;
  limbs[1].arm.rotation.x=Math.sin(swing)*.35;
 }else{
  limbs.forEach(l=>{
   l.leg.rotation.x=0;
   l.arm.rotation.x=0;
  });
 }

 if(jumping){
  jumpTime+=dt*2.6;
  const h=Math.sin(Math.min(jumpTime,1)*Math.PI)*1.15;
  player.position.y=h;
  if(jumpTime>=1){jumping=false;player.position.y=0;}
 }

 desiredCamera.set(
  player.position.x-Math.sin(facing)*.8,
  player.position.y+4,
  player.position.z+8
 );
 camera.position.lerp(desiredCamera,.075);
 lookTarget.set(player.position.x,player.position.y+1.3,player.position.z);
 camera.lookAt(lookTarget);

 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
</html>
