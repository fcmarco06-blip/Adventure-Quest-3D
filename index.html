<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventure Quest 3D</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #70c9ef;
  user-select: none;
  touch-action: none;
}

canvas {
  display: block;
}

#titre {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 21px;
  font-weight: 900;
  letter-spacing: 2px;
  text-shadow: 0 3px 6px #23445c;
  white-space: nowrap;
}

#pieces {
  position: absolute;
  top: 15px;
  left: 14px;
  background: linear-gradient(#34495e, #172633);
  color: #ffe58a;
  border: 2px solid #a9bac8;
  border-radius: 14px;
  padding: 10px 15px;
  font-weight: bold;
  box-shadow: 0 5px 12px #0007, inset 0 1px 3px #ffffff55;
}

#joystick {
  position: absolute;
  left: 25px;
  bottom: 35px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff22, #17263388);
  border: 3px solid #ffffff88;
  box-shadow: 0 5px 15px #0007, inset 0 3px 10px #0005;
  touch-action: none;
}

#joystickCentre {
  position: absolute;
  width: 57px;
  height: 57px;
  left: 31px;
  top: 31px;
  border-radius: 50%;
  background: linear-gradient(145deg,#e5edf3,#607586);
  border: 3px solid #ffffff;
  box-shadow: 0 5px 10px #0008, inset 0 3px 5px #ffffff;
}

.commandes {
  position: absolute;
  right: 20px;
  bottom: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.bouton {
  width: 78px;
  height: 65px;
  border-radius: 19px;
  border: 2px solid #ffffff99;
  color: white;
  font-size: 11px;
  font-weight: 900;
  text-shadow: 0 2px 3px #0009;
  box-shadow: 0 6px 0 #0005, 0 9px 15px #0007,
              inset 0 2px 5px #ffffff88;
  cursor: pointer;
  touch-action: none;
  transition: transform .08s, box-shadow .08s;
}

.bouton:active, .bouton.actif {
  transform: translateY(5px);
  box-shadow: 0 1px 0 #0005, inset 0 3px 8px #0005;
}

#saut {
  background: linear-gradient(145deg,#55c9ff,#0874c9);
}

#course {
  background: linear-gradient(145deg,#ffc45d,#df7414);
}

#interaction {
  background: linear-gradient(145deg,#70df9a,#16834a);
}

.icone {
  display: block;
  font-size: 25px;
  margin-bottom: 3px;
}

#message {
  position: absolute;
  bottom: 180px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-weight: bold;
  font-size: 14px;
  text-shadow: 0 2px 5px black;
  text-align: center;
  width: 85%;
  pointer-events: none;
}

@media (min-width: 800px) {
  #joystick { left: 50px; }
  .commandes { right: 50px; }
}
</style>
</head>

<body>

<div id="titre">ADVENTURE QUEST 3D</div>
<div id="pieces">🪙 <span id="compteur">0</span></div>

<div id="joystick">
  <div id="joystickCentre"></div>
</div>

<div class="commandes">
  <button class="bouton" id="saut">
    <span class="icone">⬆</span>SAUTER
  </button>
  <button class="bouton" id="course">
    <span class="icone">⚡</span>COURIR
  </button>
  <button class="bouton" id="interaction">
    <span class="icone">✋</span>INTERAGIR
  </button>
</div>

<div id="message">Explore l'île et découvre ses trésors !</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// SCÈNE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x83d5f5);
scene.fog = new THREE.Fog(0x83d5f5, 35, 100);

const camera = new THREE.PerspectiveCamera(
  65, window.innerWidth / window.innerHeight, 0.1, 150
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.prepend(renderer.domElement);

// LUMIÈRES
scene.add(new THREE.HemisphereLight(0xffffff, 0x66835b, 2));

const soleil = new THREE.DirectionalLight(0xffffff, 2);
soleil.position.set(-10, 20, 10);
scene.add(soleil);

// OCÉAN
const ocean = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({
    color: 0x168ec4,
    roughness: 0.3,
    metalness: 0.15
  })
);
ocean.rotation.x = -Math.PI / 2;
ocean.position.y = -0.8;
scene.add(ocean);

// ÎLE
const ile = new THREE.Mesh(
  new THREE.CylinderGeometry(18, 19, 2, 64),
  new THREE.MeshStandardMaterial({ color: 0xd8bd79 })
);
ile.position.y = -0.3;
scene.add(ile);

const herbe = new THREE.Mesh(
  new THREE.CircleGeometry(17.7, 64),
  new THREE.MeshStandardMaterial({ color: 0x55a94b })
);
herbe.rotation.x = -Math.PI / 2;
herbe.position.y = 0.72;
scene.add(herbe);

// ARBRES
function arbre(x,z) {
  const tronc = new THREE.Mesh(
    new THREE.CylinderGeometry(.18,.3,2,8),
    new THREE.MeshStandardMaterial({color:0x79502d})
  );
  tronc.position.set(x,1.5,z);
  scene.add(tronc);

  const feuilles = new THREE.Mesh(
    new THREE.SphereGeometry(1.15,10,9),
    new THREE.MeshStandardMaterial({color:0x238444})
  );
  feuilles.position.set(x,2.8,z);
  feuilles.scale.set(1,1.2,1);
  scene.add(feuilles);
}

[
 [-10,-7],[-12,3],[-8,10],[10,9],
 [12,-4],[7,-12],[-3,12],[14,5]
].forEach(p => arbre(p[0],p[1]));

// ROCHERS
for(let i=0;i<14;i++){
  const a = Math.random()*Math.PI*2;
  const r = 10+Math.random()*5;
  const rocher = new THREE.Mesh(
    new THREE.DodecahedronGeometry(.5+Math.random()*.6),
    new THREE.MeshStandardMaterial({color:0x858d89})
  );
  rocher.position.set(Math.cos(a)*r,.9,Math.sin(a)*r);
  scene.add(rocher);
}

// PERSONNAGE
const joueur = new THREE.Group();
scene.add(joueur);

const peau = new THREE.MeshStandardMaterial({color:0xffc18b});
const vetement = new THREE.MeshStandardMaterial({color:0x2675d8});
const pantalon = new THREE.MeshStandardMaterial({color:0x26364c});

function partie(geo, mat, x,y,z) {
  const m = new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  joueur.add(m);
  return m;
}

partie(new THREE.CapsuleGeometry(.42,.65,4,8),vetement,0,1.15,0);
partie(new THREE.SphereGeometry(.34,16,12),peau,0,1.95,0);

const jambe1 = partie(
  new THREE.BoxGeometry(.23,.65,.25),pantalon,-.18,.48,0
);
const jambe2 = partie(
  new THREE.BoxGeometry(.23,.65,.25),pantalon,.18,.48,0
);

joueur.position.set(0,.75,0);

// VISAGE
const oeilMat = new THREE.MeshBasicMaterial({color:0x202020});
partie(new THREE.SphereGeometry(.045,8,8),oeilMat,-.12,2,.29);
partie(new THREE.SphereGeometry(.045,8,8),oeilMat,.12,2,.29);

// TRÉSORS
const tresors = [];

for(let i=0;i<9;i++){
  const a = i*Math.PI*2/9;
  const r = 5+Math.random()*7;

  const piece = new THREE.Mesh(
    new THREE.TorusGeometry(.35,.11,8,20),
    new THREE.MeshStandardMaterial({
      color:0xffd32a,
      metalness:.8,
      roughness:.2
    })
  );

  piece.position.set(Math.cos(a)*r,1.3,Math.sin(a)*r);
  scene.add(piece);
  tresors.push(piece);
}

// COMMANDES
let axeX=0, axeY=0;
let courir=false, vitesseY=0, auSol=true;
let compteur=0, animationTemps=0;

const joystick=document.getElementById('joystick');
const centre=document.getElementById('joystickCentre');

let joystickActif=false;

joystick.addEventListener('pointerdown',e=>{
  joystickActif=true;
  joystick.setPointerCapture(e.pointerId);
  deplacerJoystick(e);
});

joystick.addEventListener('pointermove',e=>{
  if(joystickActif) deplacerJoystick(e);
});

function deplacerJoystick(e){
  const r=joystick.getBoundingClientRect();
  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);
  const distance=Math.hypot(x,y);
  const limite=35;

  if(distance>limite){
    x=x/distance*limite;
    y=y/distance*limite;
  }

  centre.style.transform=`translate(${x}px,${y}px)`;
  axeX=x/limite;
  axeY=y/limite;
}

function arreterJoystick(){
  joystickActif=false;
  axeX=0;
  axeY=0;
  centre.style.transform='translate(0,0)';
}

joystick.addEventListener('pointerup',arreterJoystick);
joystick.addEventListener('pointercancel',arreterJoystick);

// CLAVIER
const touches={};

window.addEventListener('keydown',e=>{
  touches[e.key.toLowerCase()]=true;
});

window.addEventListener('keyup',e=>{
  touches[e.key.toLowerCase()]=false;
});

function sauter(){
  if(auSol){
    vitesseY=8;
    auSol=false;
  }
}

document.getElementById('saut').addEventListener('pointerdown',sauter);

const boutonCourse=document.getElementById('course');

boutonCourse.addEventListener('pointerdown',e=>{
  courir=true;
  boutonCourse.classList.add('actif');
});

function arreterCourse(){
  courir=false;
  boutonCourse.classList.remove('actif');
}

boutonCourse.addEventListener('pointerup',arreterCourse);
boutonCourse.addEventListener('pointercancel',arreterCourse);
boutonCourse.addEventListener('lostpointercapture',arreterCourse);

// INTERACTION AVEC LES TRÉSORS
document.getElementById('interaction').addEventListener('pointerdown',()=>{
  let trouve=false;

  tresors.forEach((piece,i)=>{
    if(piece.visible && joueur.position.distanceTo(piece.position)<2.5){
      piece.visible=false;
      compteur++;
      trouve=true;
    }
  });

  document.getElementById('compteur').textContent=compteur;

  document.getElementById('message').textContent=
    trouve ? '✨ Trésor découvert !' : 'Approche-toi d’un trésor !';
});

// ANIMATION
const horloge=new THREE.Clock();

function animer(){
  requestAnimationFrame(animer);

  const delta=Math.min(horloge.getDelta(),.04);
  animationTemps+=delta;

  // DÉPLACEMENT
  let x=axeX;
  let z=axeY;

  if(touches['arrowleft']||touches['q']||touches['a']) x-=1;
  if(touches['arrowright']||touches['d']) x+=1;
  if(touches['arrowup']||touches['z']||touches['w']) z-=1;
  if(touches['arrowdown']||touches['s']) z+=1;
  if(touches['shift']) courir=true;
  else if(!boutonCourse.matches(':active')) courir=false;

  const longueur=Math.hypot(x,z);

  if(longueur>1){x/=longueur;z/=longueur;}

  const vitesse=courir?8:4.5;

  if(longueur>.05){
    joueur.position.x+=x*vitesse*delta;
    joueur.position.z+=z*vitesse*delta;

    joueur.rotation.y=Math.atan2(x,z);

    const mouvement=Math.sin(animationTemps*12)*.4*longueur;
    jambe1.rotation.x=mouvement;
    jambe2.rotation.x=-mouvement;
  }else{
    jambe1.rotation.x=0;
    jambe2.rotation.x=0;
  }

  // LIMITES DE L'ÎLE
  const distance=Math.hypot(joueur.position.x,joueur.position.z);

  if(distance>16){
    joueur.position.x*=16/distance;
    joueur.position.z*=16/distance;
  }

  // SAUT
  vitesseY-=20*delta;
  joueur.position.y+=vitesseY*delta;

  if(joueur.position.y<=.75){
    joueur.position.y=.75;
    vitesseY=0;
    auSol=true;
  }

  // TRÉSORS TOURNANTS
  tresors.forEach(piece=>{
    if(piece.visible){
      piece.rotation.y+=delta*2;
      piece.position.y=1.3+Math.sin(animationTemps*2)*.15;
    }
  });

  // CAMÉRA SUIVEUSE
  const positionCamera=new THREE.Vector3(
    joueur.position.x,
    joueur.position.y+5,
    joueur.position.z+9
  );

  camera.position.lerp(positionCamera,Math.min(1,delta*5));
  camera.lookAt(
    joueur.position.x,
    joueur.position.y+1,
    joueur.position.z
  );

  renderer.render(scene,camera);
}

animer();

// ADAPTATION DE L'ÉCRAN
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
