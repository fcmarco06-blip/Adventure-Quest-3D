<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Adventure Quest 3D</title>

<style>
* { box-sizing:border-box; }
body {
  margin:0;
  overflow:hidden;
  background:#101b19;
  font-family:Arial,sans-serif;
  color:white;
  touch-action:none;
}
#game { position:fixed; inset:0; }
canvas { display:block; }

#top {
  position:fixed;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}
.logo {
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 2px 8px black;
}
.coins {
  background:#14251edb;
  border:1px solid #d4ad54;
  padding:10px 15px;
  border-radius:25px;
  font-weight:bold;
}
#controls {
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  align-items:end;
  padding:0 20px;
  pointer-events:none;
}
#joystick {
  width:115px;
  height:115px;
  border-radius:50%;
  background:#ffffff22;
  border:2px solid #ffffff66;
  position:relative;
  pointer-events:auto;
  touch-action:none;
  backdrop-filter:blur(5px);
}
#stick {
  width:48px;
  height:48px;
  background:linear-gradient(145deg,#d5d5d5,#666);
  border:2px solid white;
  border-radius:50%;
  position:absolute;
  top:31px;
  left:31px;
  box-shadow:0 3px 12px #0009;
}
#buttons {
  display:grid;
  grid-template-columns:repeat(2,65px);
  gap:12px;
  pointer-events:auto;
}
.gamebtn {
  width:62px;
  height:62px;
  border-radius:50%;
  color:white;
  font-weight:bold;
  font-size:12px;
  background:linear-gradient(145deg,#344b48,#101c1a);
  border:2px solid #c4b47d;
  box-shadow:0 4px 12px #0009;
  touch-action:none;
}
.gamebtn:active {
  transform:scale(.91);
  background:#9b8146;
}
#message {
  position:fixed;
  bottom:155px;
  left:50%;
  transform:translateX(-50%);
  background:#101d1bdc;
  padding:10px 18px;
  border-radius:20px;
  font-size:12px;
  pointer-events:none;
  white-space:nowrap;
}
#loading {
  position:fixed;
  inset:0;
  background:#101b19;
  display:grid;
  place-items:center;
  z-index:10;
  font-size:18px;
  letter-spacing:2px;
}
</style>
</head>

<body>
<div id="game"></div>
<div id="loading">ADVENTURE QUEST 3D</div>

<div id="top">
  <div class="logo">ADVENTURE QUEST</div>
  <div class="coins">🪙 000</div>
</div>

<div id="message">Explore ton nouveau monde</div>

<div id="controls">
  <div id="joystick"><div id="stick"></div></div>

  <div id="buttons">
    <button class="gamebtn" onclick="action('Parler')">○<br>PARLER</button>
    <button class="gamebtn" onclick="action('Interagir')">△<br>INTERAGIR</button>
    <button class="gamebtn" id="run">×<br>COURIR</button>
    <button class="gamebtn" onclick="action('Sauter')">□<br>SAUTER</button>
  </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bbbc0);
scene.fog = new THREE.Fog(0x9bbbc0,35,115);

const camera = new THREE.PerspectiveCamera(
  65,innerWidth/innerHeight,0.1,300
);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.getElementById('game').appendChild(renderer.domElement);

// LUMIÈRE
scene.add(new THREE.HemisphereLight(0xc7e5ff,0x45552c,2));

const sun = new THREE.DirectionalLight(0xffe3b0,3);
sun.position.set(-30,45,25);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// TEXTURE DU SOL
function makeTexture(base,detail) {
  const c=document.createElement('canvas');
  c.width=c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle=base;
  ctx.fillRect(0,0,256,256);

  for(let i=0;i<4500;i++){
    ctx.fillStyle=detail[Math.floor(Math.random()*detail.length)];
    const x=Math.random()*256;
    const y=Math.random()*256;
    const s=Math.random()*3+1;
    ctx.fillRect(x,y,s,s);
  }

  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(12,12);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

const groundTexture=makeTexture(
 '#526d3e',['#617c46','#435c34','#73894d','#3d5934']
);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(250,250),
 new THREE.MeshStandardMaterial({
  map:groundTexture,
  roughness:1
 })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// COLLINES
for(let i=0;i<18;i++){
 const h=8+Math.random()*15;
 const hill=new THREE.Mesh(
  new THREE.ConeGeometry(12+Math.random()*15,h,7),
  new THREE.MeshStandardMaterial({
   color:new THREE.Color().setHSL(
    .27+Math.random()*.04,.25,.25+Math.random()*.12
   ),
   roughness:1
  })
 );
 hill.position.set(
  (Math.random()-.5)*150,
  h/2-2,
  -45-Math.random()*90
 );
 hill.receiveShadow=true;
 scene.add(hill);
}

// ARBRES
function createTree(x,z,scale=1){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25*scale,.45*scale,4*scale,8),
  new THREE.MeshStandardMaterial({color:0x60412a})
 );
 trunk.position.set(x,2*scale,z);
 trunk.castShadow=true;
 scene.add(trunk);

 for(let i=0;i<3;i++){
  const leaves=new THREE.Mesh(
   new THREE.SphereGeometry(
    (2.1-i*.25)*scale,9,8
   ),
   new THREE.MeshStandardMaterial({
    color:[0x254b2c,0x315d32,0x426c38][i],
    roughness:1
   })
  );
  leaves.position.set(
   x,
   (4.2+i*.85)*scale,
   z
  );
  leaves.castShadow=true;
  scene.add(leaves);
 }
}

for(let i=0;i<110;i++){
 const x=(Math.random()-.5)*105;
 const z=(Math.random()-.5)*115;
 if(Math.abs(x)<8 && Math.abs(z)<12)continue;
 createTree(x,z,.7+Math.random()*.8);
}

// ROCHERS
for(let i=0;i<35;i++){
 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(
   .7+Math.random()*1.5,1
  ),
  new THREE.MeshStandardMaterial({
   color:0x77796c,
   roughness:1
  })
 );
 rock.position.set(
  (Math.random()-.5)*100,
  .6,
  (Math.random()-.5)*100
 );
 rock.rotation.set(Math.random(),Math.random(),Math.random());
 rock.scale.y=.65;
 rock.castShadow=true;
 scene.add(rock);
}

// PETIT LAC
const water=new THREE.Mesh(
 new THREE.CircleGeometry(15,64),
 new THREE.MeshStandardMaterial({
  color:0x327f91,
  roughness:.22,
  metalness:.15
 })
);
water.rotation.x=-Math.PI/2;
water.position.set(19,.035,-22);
scene.add(water);

// PERSONNAGE
const player=new THREE.Group();
scene.add(player);

const skin=new THREE.MeshStandardMaterial({color:0xc58d68});
const clothes=new THREE.MeshStandardMaterial({
 color:0x344b43,roughness:.8
});
const dark=new THREE.MeshStandardMaterial({color:0x292c2a});

const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.42,.85,5,10),
 clothes
);
body.position.y=1.25;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.32,16,16),
 skin
);
head.position.y=2.05;
head.castShadow=true;
player.add(head);

const hair=new THREE.Mesh(
 new THREE.SphereGeometry(.34,12,10,0,Math.PI*2,0,Math.PI*.55),
 dark
);
hair.position.y=2.16;
player.add(hair);

const legs=[];
for(let i=0;i<2;i++){
 const leg=new THREE.Mesh(
  new THREE.CapsuleGeometry(.16,.55,4,8),
  dark
 );
 leg.position.set(i===0?-.22:.22,.42,0);
 leg.castShadow=true;
 player.add(leg);
 legs.push(leg);
}

// CAMÉRA
player.position.set(0,0,0);
camera.position.set(0,4,8);

let moveX=0,moveY=0;
let running=false;
let jumping=false;
let jumpHeight=0;
let angle=0;
let walkTime=0;

function action(name){
 document.getElementById('message').textContent=
 name==='Sauter'?'Saut !':
 name==='Parler'?'Aucun personnage à proximité pour parler':
 name==='Interagir'?'Rien à proximité pour interagir':
 name;
 if(name==='Sauter' && !jumping){
  jumping=true;
  jumpHeight=0;
 }
}

// JOYSTICK
const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');
let active=false;

function joystickMove(e){
 const r=joy.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;
 let dx=e.clientX-cx;
 let dy=e.clientY-cy;
 const max=35;
 const d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max;}
 moveX=dx/max;
 moveY=dy/max;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}

joy.addEventListener('pointerdown',e=>{
 active=true;
 joy.setPointerCapture(e.pointerId);
 joystickMove(e);
});

joy.addEventListener('pointermove',e=>{
 if(active)joystickMove(e);
});

function resetJoy(){
 active=false;
 moveX=moveY=0;
 stick.style.transform='translate(0,0)';
}

joy.addEventListener('pointerup',resetJoy);
joy.addEventListener('pointercancel',resetJoy);

// COURIR
const run=document.getElementById('run');
run.addEventListener('pointerdown',()=>running=true);
run.addEventListener('pointerup',()=>running=false);
run.addEventListener('pointercancel',()=>running=false);
run.addEventListener('pointerleave',()=>running=false);

// CLAVIER
window.addEventListener('keydown',e=>{
 if(e.key==='Shift')running=true;
 if(e.key==='ArrowUp'||e.key==='w')moveY=-1;
 if(e.key==='ArrowDown'||e.key==='s')moveY=1;
 if(e.key==='ArrowLeft'||e.key==='a')moveX=-1;
 if(e.key==='ArrowRight'||e.key==='d')moveX=1;
});
window.addEventListener('keyup',e=>{
 if(e.key==='Shift')running=false;
 if(['ArrowUp','ArrowDown','w','s'].includes(e.key))moveY=0;
 if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))moveX=0;
});

// ANIMATION
const clock=new THREE.Clock();
const target=new THREE.Vector3();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);
 const moving=Math.abs(moveX)+Math.abs(moveY)>.1;

 if(moving){
  const speed=running?8:4;
  const forward=new THREE.Vector3(moveX,0,moveY);
  forward.normalize();

  player.position.x+=forward.x*speed*dt;
  player.position.z+=forward.z*speed*dt;

  angle=Math.atan2(forward.x,forward.z);
  player.rotation.y=angle;

  walkTime+=dt*(running?13:8);
  legs[0].rotation.x=Math.sin(walkTime)*.65;
  legs[1].rotation.x=-Math.sin(walkTime)*.65;
 }else{
  legs[0].rotation.x=0;
  legs[1].rotation.x=0;
 }

 if(jumping){
  jumpHeight+=dt*2.8;
  body.position.y=1.25+Math.sin(jumpHeight*Math.PI)*1.3;
  if(jumpHeight>=1){
   jumping=false;
   jumpHeight=0;
   body.position.y=1.25;
  }
 }

 target.set(
  player.position.x-Math.sin(angle)*.5,
  3.6,
  player.position.z+8
 );

 camera.position.lerp(target,.08);
 camera.lookAt(
  player.position.x,
  player.position.y+1.4,
  player.position.z
 );

 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').style.display='none';
animate();
</script>
</body>
</html>
